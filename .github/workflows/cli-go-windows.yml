name: Build and verify Go CLI for Windows

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      formal_release:
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['cli-go/**', 'kb-gateway/**', 'skill/**', 'versions.toml', 'scripts/stage_skill_resources.py', 'scripts/sync_versions.py', '.github/workflows/cli-go-windows.yml']
  pull_request:
    paths: ['cli-go/**', 'kb-gateway/**', 'skill/**', 'versions.toml', 'scripts/stage_skill_resources.py', 'scripts/sync_versions.py', '.github/workflows/cli-go-windows.yml']

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.25.x'
          cache-dependency-path: cli-go/go.sum
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Run Go checks on Windows
        working-directory: cli-go
        shell: pwsh
        run: |
          go test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet ./...
      - name: Verify shared Wiki gateway
        working-directory: kb-gateway
        run: go test ./...
      - name: Set up WiX and build through the double-click launcher
        working-directory: cli-go
        shell: pwsh
        run: |
          $tools = Join-Path $env:RUNNER_TEMP 'wix'
          dotnet tool install wix --version 5.0.2 --tool-path $tools
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tools >> $env:GITHUB_PATH
          $env:Path = "$tools;$env:Path"
          Copy-Item ../cli-python/config.example.json ./config.json
          cmd.exe /d /c 'build.cmd < nul'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $output = @(Get-ChildItem -LiteralPath ./dist -Directory)
          if ($output.Count -ne 1) { throw 'Expected one build output directory' }
          "WISEREC_GO_PACKAGES=cli-go/dist/$($output[0].Name)" >> $env:GITHUB_ENV
      - name: Check optional Wiki portable package
        working-directory: cli-go
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'go-kb-package'
          ./scripts/build-release.ps1 -ConfigPath ./config.example.json -OutputDirectory $work -PortableOnly
          $zip = Get-ChildItem -LiteralPath $work -Filter '*.zip'
          $expanded = Join-Path $work 'expanded'
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $expanded
          $exe = Get-ChildItem -LiteralPath $expanded -Filter ml.exe -Recurse
          $helpText = & $exe.FullName kb search --help
          if ($LASTEXITCODE -ne 0 -or ($helpText -join ' ') -notmatch 'ml kb search') { throw 'Missing Wiki command' }
          if (-not (Test-Path (Join-Path $exe.DirectoryName 'agent/skills/wiserec-platform/references/kb.md'))) { throw 'Missing Wiki Skill' }
      - name: Rebuild the same version for MSI replacement verification
        working-directory: cli-go
        shell: pwsh
        run: |
          ./scripts/build-release.cmd -ConfigPath ./config.json -OutputDirectory "$env:RUNNER_TEMP/go-replacement-packages"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build a higher version in an isolated source tree for upgrade verification
        working-directory: cli-go
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'go-upgrade-source.zip'
          $fixture = Join-Path $env:RUNNER_TEMP 'go-upgrade-source'
          git -C .. archive --format=zip --output=$archive HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Expand-Archive $archive $fixture
          Push-Location (Join-Path $fixture 'cli-go')
          try {
            @'
          from pathlib import Path
          import re

          path = Path("../versions.toml")
          text = path.read_text(encoding="utf-8")
          match = re.search(r'^cli_go = "(\d+)\.(\d+)\.(\d+)"$', text, re.M)
          major, minor, patch = map(int, match.groups())
          version = f"{major}.{minor}.{patch + 1}"
          python_version = re.search(r'^cli = "([^"]+)"$', text, re.M).group(1)
          if python_version in (version, f"{version}.0"):
              version = f"{major}.{minor}.{patch + 2}"
          path.write_text(text[:match.start()] + f'cli_go = "{version}"' + text[match.end():], encoding="utf-8")
          '@ | python -
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            python ../scripts/sync_versions.py
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            ./scripts/build-release.cmd -ConfigPath ../cli-python/config.example.json -OutputDirectory "$env:RUNNER_TEMP/go-upgrade-packages"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }
      - name: Build Go 1.1.0 upgrade baseline from its source commit
        if: inputs.formal_release
        shell: pwsh
        run: |
          $source = Join-Path $env:RUNNER_TEMP 'previous-go'
          git worktree add --detach $source 350a07de1e3b8e3dc51c1daef2091a86b89ad2e7
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location (Join-Path $source 'cli-go')
          try {
            ./scripts/build-release.cmd -ConfigPath ../cli-python/config.example.json -OutputDirectory "$env:RUNNER_TEMP/previous-go-packages"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }
          "WISECLI_PREVIOUS_PACKAGES=$env:RUNNER_TEMP/previous-go-packages" >> $env:GITHUB_ENV
      - name: Verify portable package and MSI lifecycle offline
        working-directory: cli-go
        shell: pwsh
        run: |
          $firewallGroup = "WiseRec MSI CI $([guid]::NewGuid())"
          try {
            New-NetFirewallRule -DisplayName "$firewallGroup installer" -Group $firewallGroup `
              -Direction Outbound -Program (Join-Path $env:SystemRoot 'System32\msiexec.exe') -Action Block -ErrorAction Stop | Out-Null
            ./scripts/installer/verify-windows.ps1 -Packages (Join-Path $env:GITHUB_WORKSPACE $env:WISEREC_GO_PACKAGES) `
              -ReplacementPackages "$env:RUNNER_TEMP/go-replacement-packages" `
              -UpgradePackages "$env:RUNNER_TEMP/go-upgrade-packages" -Work "$env:RUNNER_TEMP/go-msi-verification" `
              -PreviousPackages $env:WISECLI_PREVIOUS_PACKAGES
          } finally {
            Remove-NetFirewallRule -Group $firewallGroup -ErrorAction SilentlyContinue
          }
      - name: Upload verified example-config packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cli-go-windows-x64-test
          path: |
            ${{ env.WISEREC_GO_PACKAGES }}/*.msi
            ${{ env.WISEREC_GO_PACKAGES }}/*.zip
          if-no-files-found: error
      - name: Upload Windows Installer logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cli-go-msi-logs
          path: ${{ runner.temp }}/go-msi-verification/*.log
          if-no-files-found: ignore
