name: Independent CLI demo validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/wiserec_cli/**'
      - 'devtools/mock-platform/**'
      - 'scripts/demo/**'
      - 'scripts/releasing/check-cli-package.py'
      - 'pyproject.toml'
      - 'setup.py'
      - 'MANIFEST.in'
      - '.github/workflows/demo.yml'
permissions:
  contents: read
jobs:
  demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[jupyter-local]' -e ./devtools/mock-platform pytest build -r access-service/requirements.lock
      - run: python -m pytest devtools/mock-platform/tests tests/test_execution_context.py -q
      - run: python -m build --outdir /tmp/formal
      - run: python scripts/releasing/check-cli-package.py /tmp/formal/*
      - run: python scripts/demo/build-demo.py --offline
      - run: python devtools/mock-platform/tests/validate_bundle.py release/demo/*-demo-offline.zip
  windows-demo:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install build -r access-service/requirements.lock
      - run: python scripts/demo/build-demo.py --offline
      - name: Install isolated ml and verify actual permission service calls
        shell: powershell
        run: |
          $archive = Get-ChildItem release/demo/*-demo-offline.zip
          python devtools/mock-platform/tests/validate_bundle.py $archive.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Demo bundle validation failed' }
