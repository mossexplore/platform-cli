name: DSH Windows plugin

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'dsh-plugin/**'
      - 'cli-go/**'
      - 'scripts/build_dsh_plugin.py'
      - 'tests/test_dsh_plugin_package.py'
      - 'telemetry-gateway/**'
      - 'scripts/sync_versions.py'
      - 'versions.toml'
      - '.github/workflows/dsh-plugin-windows.yml'
  push:
    branches: [main]
    paths:
      - 'dsh-plugin/**'
      - 'cli-go/**'
      - 'scripts/build_dsh_plugin.py'
      - 'tests/test_dsh_plugin_package.py'
      - 'telemetry-gateway/**'
      - 'scripts/sync_versions.py'
      - 'versions.toml'
      - '.github/workflows/dsh-plugin-windows.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli-go/go.mod
          cache-dependency-path: cli-go/go.sum

      - name: Test the plugin
        run: node --test dsh-plugin/wiserec-cli/tests/plugin.test.mjs dsh-plugin/wiserec-cli/tests/telemetry.test.mjs
      - name: Verify both bundle variants and ZIP wrappers
        run: python -m unittest discover -s tests -p test_dsh_plugin_package.py
      - name: Test Go CLI and build the compatible Windows binary
        working-directory: cli-go
        run: |
          go test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $overlay = Join-Path $env:RUNNER_TEMP 'dsh-build-overlay.json'
          $embedded = (Resolve-Path internal/localstate/config.embedded.json).Path
          $example = (Resolve-Path ../cli-python/config.example.json).Path
          $replacement = @{}
          $replacement[$embedded] = $example
          @{ Replace = $replacement } | ConvertTo-Json -Compress | Set-Content -LiteralPath $overlay -Encoding utf8NoBOM
          go build -overlay $overlay -o "$env:RUNNER_TEMP/ml.exe" ./cmd/ml
      - name: Build and verify the installable DSH bundle
        shell: pwsh
        run: |
          $configPath = 'dsh-plugin/wiserec-cli/config.json'
          $original = Get-Content -LiteralPath $configPath -Raw
          $config = $original | ConvertFrom-Json
          $config.build.includeTelemetry = $false
          try {
            $config | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath $configPath -Encoding utf8NoBOM
            $buildOutput = @(cmd.exe /d /c 'dsh-plugin\wiserec-cli\build.cmd < nul')
            $buildStatus = $LASTEXITCODE
          } finally {
            Set-Content -LiteralPath $configPath -Value $original -NoNewline -Encoding utf8NoBOM
          }
          $buildOutput | Write-Host
          if ($buildStatus -ne 0) { exit $buildStatus }
          $output = (Resolve-Path dsh-plugin/wiserec-cli/dist).Path
          $packages = @(Get-ChildItem -LiteralPath $output -File -Recurse)
          if ($packages.Count -ne 1 -or $packages[0].Extension -ne '.tgz') {
            throw 'Expected exactly one .tgz from build.cmd'
          }
          $bundle = $packages[0]
          if ($bundle.Directory.Parent.FullName -ne $output -or $bundle.Directory.Name -notmatch '^dsh-\d{8}-\d{6}-[0-9a-f]{8}$') {
            throw 'Package directory must be under the build.cmd dist and match dsh-YYYYMMDD-HHmmss-xxxxxxxx'
          }
          $actual = (Get-FileHash -LiteralPath $bundle.FullName -Algorithm SHA256).Hash
          if ($buildOutput -notcontains "SHA256: $actual") { throw 'Bundle SHA256 does not match build output' }
          $bundleFiles = @(& tar.exe -tf $bundle.FullName)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($file in @('package.json', 'release.json', 'index.js', 'client.js', 'config.js', 'config.json', 'logging.js', 'runner.js', 'session-status.js', 'cordis.patch.yml', 'README.md', 'LICENSE')) {
            if ($bundleFiles -notcontains "package/$file") { throw "Missing bundle file: $file" }
          }
          $manifestJson = @(& tar.exe -xOf $bundle.FullName package/package.json)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $manifest = ($manifestJson -join "`n") | ConvertFrom-Json
          $releaseJson = @(& tar.exe -xOf $bundle.FullName package/release.json)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $release = ($releaseJson -join "`n") | ConvertFrom-Json
          if ($release.includeTelemetry -ne $false -or ($bundleFiles -match '^package/telemetry/')) {
            throw 'Expected the keepalive-only Windows artifact'
          }
          if ($release.revision -ne $env:GITHUB_SHA) { throw 'Bundle source revision does not match CI checkout' }
          if ($bundle.Name -ne "$($manifest.name)-$($manifest.version).tgz" -or
              $release.version -ne $manifest.version -or $release.dsh_version -ne $manifest.engines.dsh) {
            throw 'Bundle version or DSH compatibility metadata does not match'
          }
          $capability = & "$env:RUNNER_TEMP/ml.exe" auth ping tick --capabilities | ConvertFrom-Json
          if ($capability.protocol -ne $release.cli_protocol -or $capability.cli_version -ne $release.cli_version) {
            throw 'CLI capability does not match the plugin bundle metadata'
          }
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-wiserec-cli-keepalive-windows
          path: dsh-plugin/wiserec-cli/dist/**/*.tgz
          if-no-files-found: error

  gateway-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: telemetry-gateway/go.mod
          cache: false
      - name: Test and vet the gateway
        working-directory: telemetry-gateway
        run: |
          go test -race ./...
          go vet ./...
      - name: Build and check the Linux amd64 container
        run: |
          docker build --platform linux/amd64 -t wiserec-telemetry-gateway:ci telemetry-gateway
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}} {{.Config.User}}' wiserec-telemetry-gateway:ci)" = "linux/amd64 nonroot:nonroot"
          container=$(docker run -d --rm -p 127.0.0.1:8088:8088 \
            -e LANGFUSE_BASE_URL=http://127.0.0.1:9 \
            -e LANGFUSE_PUBLIC_KEY=fixture-public -e LANGFUSE_SECRET_KEY=fixture-secret wiserec-telemetry-gateway:ci)
          trap 'docker stop "$container"' EXIT
          curl --fail --silent --show-error --retry 5 --retry-connrefused http://127.0.0.1:8088/health
