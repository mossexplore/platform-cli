name: Build and publish access image
on:
  push:
    branches: [main]
    paths:
      - 'access-service/**'
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/access-image.yml'
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      formal_release:
        type: boolean
        default: false
    outputs:
      digest:
        value: ${{ jobs.image.outputs.digest }}
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: access-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Validate version and publication source
        id: info
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          OWNER: ${{ github.repository_owner }}
        run: |
          python - <<'PY'
          import os, pathlib, re, tomllib
          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          cli = pathlib.Path('src/wiserec_cli/__init__.py').read_text()
          assert f'__version__ = "{version}"' in cli
          assert re.fullmatch(r'\d+\.\d+\.\d+', version)
          event, ref = os.environ['EVENT'], os.environ['REF']
          publish = ref == 'refs/heads/main' and event in ('push', 'workflow_dispatch')
          image = 'ghcr.io/' + os.environ['OWNER'].lower() + '/cli-access'
          candidate = image + ':candidate-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'version={version}\nimage={image}\ncandidate={candidate}\npublish={str(publish).lower()}\n')
          PY
      - name: Install test dependencies
        run: python -m pip install -e . -r access-service/requirements.lock pytest
      - name: CLI tests
        env:
          # Typer forces ANSI output on GitHub; help assertions require plain text.
          _TYPER_FORCE_DISABLE_TERMINAL: "1"
        run: python -m pytest tests -q
      - name: Access service tests
        working-directory: access-service
        run: python -m pytest tests -q
      - name: Browser timezone regression tests
        run: node --test access-service/tests/test_time_presets.cjs
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Login to GHCR
        if: steps.info.outputs.publish == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build candidate (not yet approved for deployment)
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./access-service
          platforms: linux/amd64
          push: ${{ steps.info.outputs.publish == 'true' }}
          load: ${{ steps.info.outputs.publish != 'true' }}
          tags: ${{ steps.info.outputs.publish == 'true' && steps.info.outputs.candidate || 'cli-access:test' }}
          build-args: |
            VERSION=${{ steps.info.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=cli-access-amd64
          cache-to: type=gha,mode=max,scope=cli-access-amd64
          sbom: ${{ steps.info.outputs.publish == 'true' }}
          provenance: ${{ steps.info.outputs.publish == 'true' && 'mode=max' || 'false' }}
      - name: Test exact image with MySQL 8
        env:
          PUBLISH: ${{ steps.info.outputs.publish }}
          IMAGE: ${{ steps.info.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          export CLI_ACCESS_IMAGE=cli-access:test
          if [[ "$PUBLISH" == true ]]; then
            export CLI_ACCESS_IMAGE="$IMAGE@$DIGEST"
            docker pull "$CLI_ACCESS_IMAGE"
          fi
          bash access-service/ci/smoke.sh
      - name: Attest tested image
        if: steps.info.outputs.publish == 'true'
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ steps.info.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Promote tested digest without rebuilding
        if: steps.info.outputs.publish == 'true'
        env:
          IMAGE: ${{ steps.info.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.info.outputs.version }}
          EVENT: ${{ github.event_name }}
        run: |
          tags=(--tag "$IMAGE:sha-$GITHUB_SHA")
          tags+=(--tag "$IMAGE:main")
          docker buildx imagetools create "${tags[@]}" "$IMAGE@$DIGEST"
          {
            echo '### Tested Linux amd64 image'
            echo "Image: \`$IMAGE@$DIGEST\`"
            echo "Commit: \`$GITHUB_SHA\`; project version: \`$VERSION\`"
            echo 'Tests: CLI + access service + timezones + MySQL image smoke/restart.'
            echo 'Set CLI_ACCESS_IMAGE to the digest above; production is not deployed automatically.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Export tested image for offline servers
        if: steps.info.outputs.publish == 'true'
        env:
          IMAGE_REFERENCE: ${{ steps.info.outputs.image }}@${{ steps.build.outputs.digest }}
          OUTPUT_DIR: ${{ runner.temp }}/offline-image
          FORMAL_RELEASE: ${{ inputs.formal_release || false }}
        run: bash access-service/ci/export-image.sh
      - name: Upload offline Docker download
        if: steps.info.outputs.publish == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: offline-image-${{ github.run_id }}
          path: ${{ runner.temp }}/offline-image/
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: access-smoke-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cli-access-smoke.log
          if-no-files-found: ignore
          retention-days: 7
