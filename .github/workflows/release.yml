name: Prepare formal release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: formal-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Check component version sources and release scope
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          python scripts/sync_versions.py --check
          version=$(python - <<'PY'
          import pathlib, tomllib
          versions = tomllib.loads(pathlib.Path('versions.toml').read_text())['components']
          version = versions['access']
          assert version == versions['cli_go'] == versions['telemetry_gateway']
          assert pathlib.Path(f'docs/releases/RELEASE_NOTES_{version}.md').is_file()
          print(version)
          PY
          )
          tags=$(git ls-remote --tags origin "refs/tags/v$version")
          test -z "$tags"
          echo "version=$version" >> "$GITHUB_OUTPUT"
  cli:
    needs: validate
    uses: ./.github/workflows/cli-go-windows.yml
    with:
      formal_release: true
  image:
    needs: validate
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/access-image.yml
    with:
      formal_release: true
  gateway:
    needs: validate
    uses: ./.github/workflows/telemetry-gateway.yml
  draft:
    needs: [validate, cli, image, gateway]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
      GATEWAY_IMAGE_ID: ${{ needs.gateway.outputs.image_id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cli-go-windows-x64-test
          path: windows
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: offline-image-${{ github.run_id }}
          path: release-assets
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.gateway.outputs.artifact }}
          path: gateway
      - name: Verify and assemble attachments
        run: python scripts/releasing/go-suite-assets.py prepare release-assets windows gateway
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Tag tested access image and create release draft
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          image="ghcr.io/${OWNER,,}/cli-access"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite.' >&2
            exit 1
          fi
          if docker buildx imagetools inspect "$image:$VERSION" >/dev/null 2>&1; then
            echo 'Versioned image already exists; refusing to overwrite.' >&2
            exit 1
          fi
          gh release create "v$VERSION" --target "$GITHUB_SHA" --draft \
            --title "v$VERSION — Go CLI、权限管理系统与 DSH 遥测网关" \
            --notes-file "docs/releases/RELEASE_NOTES_$VERSION.md" release-assets/*
          docker buildx imagetools create --tag "$image:$VERSION" "$image@$IMAGE_DIGEST"
  verify-draft:
    needs: [validate, image, gateway, draft]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.validate.outputs.version }}
      IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
      GATEWAY_IMAGE_ID: ${{ needs.gateway.outputs.image_id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Download draft and independently recheck it
        run: |
          gh api "$(gh release view "v$VERSION" --json apiUrl --jq .apiUrl)" > "$RUNNER_TEMP/draft.json"
          gh release download "v$VERSION" --dir verified-assets
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends msitools
          python scripts/releasing/go-suite-assets.py verify verified-assets "$RUNNER_TEMP/draft.json" --check-msi
          docker load -i "verified-assets/cli-access-$VERSION-linux-amd64.tar.gz"
          docker load -i "verified-assets/wiserec-telemetry-gateway-$VERSION-linux-amd64.tar.gz"
          access_image_id=$(jq -er .image_id verified-assets/manifest.json)
          test "$(docker image inspect --format '{{.Id}}' "cli-access:$VERSION")" = "$access_image_id"
          test "$(docker image inspect --format '{{.Id}}' "wiserec-telemetry-gateway:$VERSION")" = "$GATEWAY_IMAGE_ID"
          test "$(docker run --rm --pull=never --network none "cli-access:$VERSION" python -c 'import os; print(os.getuid())')" = 10001
          echo 'All assets downloaded and verified. Draft remains unpublished.' >> "$GITHUB_STEP_SUMMARY"
