name: Prepare formal release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: formal-release
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      cli_version: ${{ steps.version.outputs.cli_version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - id: version
        env:
          REF: ${{ github.ref }}
        run: |
          test "$REF" = refs/heads/main
          python - <<'PY'
          import os, re, pathlib, tomllib
          version = pathlib.Path('access-service/VERSION').read_text().strip()
          cli_version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          assert re.fullmatch(r'\d+\.\d+\.\d+\.\d+', version)
          assert cli_version == '1.0.3', 'This service-only release reuses the published CLI 1.0.3 binaries'
          assert pathlib.Path(f'docs/RELEASE_NOTES_{version}.md').is_file()
          assert f'__version__ = "{cli_version}"' in pathlib.Path('src/wiserec_cli/__init__.py').read_text()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'version={version}\ncli_version={cli_version}\n')
          PY
  image:
    needs: validate
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/access-image.yml
    with:
      formal_release: true
  cli:
    needs: validate
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      PY_PYTHON3: '3.12'
      PY_PYTHON: '3.12'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          architecture: x64
      - name: Download immutable CLI 1.0.3 release assets
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory release | Out-Null
          gh release download v1.0.3 --pattern 'wiserec-cli-1.0.3-*.zip' --pattern 'wiserec_cli-1.0.3-*.whl' --pattern SHA256SUMS --dir release
          if ($LASTEXITCODE -ne 0) { throw 'CLI source release download failed' }
          py -3 scripts/releasing/verify-cli-baseline.py release
          if ($LASTEXITCODE -ne 0) { throw 'CLI baseline checksum failed' }
      - name: Build previous CLI for upgrade test
        shell: powershell
        run: |
          py -3 -m pip install build 'setuptools>=68'
          if ($LASTEXITCODE -ne 0) { throw 'Previous build tools installation failed' }
          git worktree add --detach "$env:RUNNER_TEMP/previous-cli" 10b979da116356cead5667fbadaf4057678307a2
          if ($LASTEXITCODE -ne 0) { throw 'Previous checkout failed' }
          py -3 -m build --wheel --no-isolation --outdir "$env:RUNNER_TEMP/previous-wheel" "$env:RUNNER_TEMP/previous-cli"
          if ($LASTEXITCODE -ne 0) { throw 'Previous build failed' }
      - name: Verify clean installs, offline install and upgrade
        shell: powershell
        run: ./scripts/releasing/verify-windows.ps1
      - name: Collect CLI assets
        shell: powershell
        run: |
          New-Item -ItemType Directory assets | Out-Null
          Copy-Item release/*.zip assets/
          Copy-Item release/*.whl assets/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-cli
          path: assets/
          retention-days: 30
          if-no-files-found: error
  draft:
    needs: [validate, cli, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-cli
          path: release-assets
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: offline-image-${{ github.run_id }}
          path: release-assets
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify assets and prepare release metadata
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          CLI_VERSION: ${{ needs.validate.outputs.cli_version }}
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/cli-baseline
          gh release download "v$CLI_VERSION" --pattern SHA256SUMS --pattern CLI-install.md --pattern CLI-reference.md --dir /tmp/cli-baseline
          cp /tmp/cli-baseline/CLI-install.md /tmp/cli-baseline/CLI-reference.md release-assets/
          python scripts/releasing/verify-cli-baseline.py release-assets /tmp/cli-baseline/SHA256SUMS
          python scripts/releasing/prepare-assets.py
      - name: Tag exact tested image and upload draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}
          DIGEST: ${{ needs.image.outputs.digest }}
          OWNER: ${{ github.repository_owner }}
        run: |
          image="ghcr.io/${OWNER,,}/cli-access"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite.' >&2
            exit 1
          fi
          if docker buildx imagetools inspect "$image:$VERSION" >/dev/null 2>&1; then
            echo 'Image version already exists; refusing to overwrite.' >&2
            exit 1
          fi
          docker buildx imagetools create --tag "$image:$VERSION" "$image@$DIGEST"
          gh release create "v$VERSION" --target "$GITHUB_SHA" --draft \
            --title "v$VERSION — 权限管理系统（CLI 1.0.3）" \
            --notes-file "docs/RELEASE_NOTES_${VERSION}.md" release-assets/*
          echo 'Draft ready. Verify assets and publish after review.' >> "$GITHUB_STEP_SUMMARY"
