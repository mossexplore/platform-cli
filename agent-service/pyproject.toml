[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "wiserec-agent"
version = "1.0.7.12"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<2.1", "pymysql>=1.1,<2", "cryptography>=44", "openai-agents>=0.4,<1", "playwright>=1.40,<2", "httpx>=0.27,<1", "pydantic>=2.10,<3", "alembic>=1.14,<2"]
[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.setuptools.package-data]
app = ["static/*", "static/assets/*", "static/vendor/*", "static/vendor/fonts/*", "static/vendor/licenses/*"]
[tool.pytest.ini_options]
pythonpath = [".", "../src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
