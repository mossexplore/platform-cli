{% for name,count in actors %}<tr><td><a href="{{ log_link(username_exact=name) }}">{{ name }}</a></td><td>{{ actor_names.get(name) or '—' }}</td><td class="ranking-number">{{ count }}</td><td class="ranking-number">{{ '%.1f'|format(count / total * 100) }}%</td></tr>{% else %}<tr><td colspan="4"><div class="empty">暂无用户记录</div></td></tr>{% endfor %}
