<dialog class="bulk-dialog" id="bulk-grants" aria-labelledby="bulk-title" data-csrf="{{ csrf }}" data-actor="{{ admin.id }}">
<div class="drawer-heading"><h2 id="bulk-title">批量编辑环境授权</h2><button type="button" class="text-button" data-close aria-label="关闭批量编辑" title="关闭">关闭</button></div>
<div class="bulk-body">
<div class="form-error" role="alert" hidden></div>
<div class="bulk-section-heading"><h3>授权人员</h3><span class="count" data-bulk-count></span></div><div class="bulk-selected" data-bulk-selected></div>
<form id="bulk-edit-form">
<fieldset class="bulk-environments"><legend>授权环境 <span data-environment-count>已选 0 个</span></legend>
<div class="bulk-environment-heading"><input type="checkbox" data-environments-all aria-label="全选可授权环境"><span>环境名称</span><span>环境标识</span><span>状态</span></div>
{% for env in bulk_environments %}<label class="bulk-environment-choice"><input type="checkbox" name="environments" value="{{ env.id }}" aria-label="{{ env.name }}" {% if not env.enabled %}disabled{% endif %}><strong>{{ env.display_name }}</strong><span class="mono">{{ env.name }}</span><span class="badge {{ 'positive' if env.enabled else 'neutral' }}">{{ '已启用' if env.enabled else '已停用' }}</span></label>{% else %}<p class="bulk-empty">暂无环境</p>{% endfor %}
</fieldset>
</form>
</div>
<div class="drawer-footer"><button type="button" class="secondary" data-close>取消</button><button type="submit" form="bulk-edit-form" data-bulk-save disabled>确定授权</button></div>
</dialog>
