{% for name,count in commands %}<tr><td><a class="mono" href="{{ log_link(command_exact=name) }}">{{ name or 'unknown' }}</a></td><td class="ranking-number">{{ count }}</td><td class="ranking-number">{{ '%.1f'|format(count / total * 100) }}%</td></tr>{% else %}<tr><td colspan="3"><div class="empty">暂无命令记录</div></td></tr>{% endfor %}
