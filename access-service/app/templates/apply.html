<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CLI 权限申请</title><link rel="stylesheet" href="/cli-permission/static/app.css"><link rel="stylesheet" href="/cli-permission/static/applications.css"></head>
<body class="application-public"><main class="{{ 'receipt-card' if item is defined else 'application-card' }}">
{% if item is defined %}
{% include 'application_receipt.html' %}
{% elif duplicate is defined %}
<p class="eyebrow">WiseRec CLI</p><h1>请勿重复提交</h1><p>该账号已有待审批申请。请使用首次提交时的查询链接，或联系管理员确认。</p><a href="/cli-permission/apply">返回申请页</a>
{% else %}
<p class="eyebrow">WiseRec CLI</p><h1>申请 CLI 使用权限</h1><p class="muted">填写平台账号和姓名，审批通过后即可使用已授权环境。</p>
<form method="post" action="/cli-permission/apply"><input type="hidden" name="csrf" value="{{ csrf }}">
<label>平台账号（W3账号）<input name="username" required maxlength="128" autocomplete="username" placeholder="如 l00123456"><small>请填写 W3 账号，如 l00123456，不要填写姓名或邮箱。</small></label>
<label>姓名<input name="display_name" required maxlength="128" autocomplete="name" placeholder="请输入姓名"></label><button type="submit">提交申请</button></form>
{% endif %}
{% if item is not defined %}<p class="hint">时间均按北京时间展示。</p>{% endif %}</main></body></html>
