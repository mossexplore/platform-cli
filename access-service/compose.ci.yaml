# Test-only database. No production credentials or persistent database volumes.
services:
  cli-access:
    environment:
      DATABASE_URL: mysql+pymysql://ci:ci-test-only@mysql:3306/cli_access?charset=utf8mb4
      COOKIE_SECURE: "false"
    depends_on:
      mysql:
        condition: service_healthy
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: cli_access
      MYSQL_USER: ci
      MYSQL_PASSWORD: ci-test-only
      MYSQL_ROOT_PASSWORD: root-test-only
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql --protocol=TCP -h 127.0.0.1 -u$$MYSQL_USER -D $$MYSQL_DATABASE -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s
